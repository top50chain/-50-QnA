<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>으뜸50 무물보</title>
<style>
  :root{
    --orange:#FF7A2F;
    --orange-050:#FFF7F2;
    --orange-100:#FFEBDD;
    --ink:#1A1A1A;
    --ink-2:#8B8B8B;
    --ink-3:#B8B8B8;
    --border:#ECECEC;
    --border-soft:#F4F4F4;
    --gray-bg:#FAFAFA;
    --badge-bg:#F2F2F2;
    --white:#FFFFFF;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Segoe UI",Roboto,sans-serif;
    background:var(--white);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  button, input, textarea, select{ font-family:inherit; }
  .app{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    background:var(--white);
    position:relative;
  }
  @media (min-width:680px){
    .app{ max-width:600px; }
  }

  /* ---------- header ---------- */
  .header{
    padding:22px 20px 0;
  }
  .brand{
    display:flex; align-items:center; justify-content:center; margin-bottom:12px;
  }
  .brand img{ height:46px; width:auto; display:block; }

  /* ---------- search ---------- */
  .search-wrap{ position:relative; z-index:40; }
  .search-box{
    position:relative;
    display:flex; align-items:center; gap:10px;
    height:58px;
    background:var(--orange-050);
    border:1px solid #FBE3D2;
    border-radius:18px;
    padding:0 16px;
  }
  .search-box svg{ flex:none; color:#D99a6f; }
  .search-input-area{ flex:1; position:relative; height:100%; display:flex; align-items:center; }
  .search-input-area input{
    width:100%; border:none; background:transparent; outline:none;
    font-size:15px; color:var(--ink); font-weight:500;
    height:100%;
  }
  .search-input-area input::placeholder{ color:#B79A87; font-weight:500; }
  .search-clear{
    flex:none; width:22px;height:22px;border-radius:50%;
    background:#F4D9C4; color:#B5601F;
    border:none; font-size:12px; cursor:pointer; display:none;
    align-items:center; justify-content:center; line-height:1;
  }

  /* quick popular ticker (single line, Naver-style slide) */
  .quick-popular{
    display:flex; align-items:center; gap:8px;
    padding:10px 4px 0 4px;
    cursor:pointer;
  }
  .quick-popular.hidden{ display:none; }
  .qp-label{
    flex:none; font-size:11.5px; font-weight:800; color:var(--orange);
    white-space:nowrap;
  }
  .qp-viewport{
    flex:1; height:19px; overflow:hidden; position:relative;
  }
  .qp-item{
    position:absolute; left:0; top:0; width:100%;
    font-size:12.5px; color:var(--ink-2); font-weight:500;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    transform:translateY(0); opacity:1;
    transition:transform .38s ease, opacity .38s ease;
  }
  .qp-item .qp-rank{
    display:inline-block; min-width:14px; text-align:center;
    background:var(--orange); color:#fff; font-size:9px; font-weight:800;
    border-radius:4px; padding:2px 4px; margin-right:7px; vertical-align:1px;
  }
  .qp-item.out{ transform:translateY(-100%); opacity:0; }
  .qp-item.in-start{ transform:translateY(100%); opacity:0; }

  /* dropdown */
  .dropdown{
    position:absolute; left:0; right:0; top:calc(100% + 8px);
    background:var(--white);
    border:1px solid var(--border);
    border-radius:16px;
    padding:6px 0;
    display:none;
    max-height:70vh; overflow-y:auto;
  }
  .dropdown.show{ display:block; }
  .dd-section{ padding:12px 18px 8px; }
  .dd-title{ font-size:11.5px; font-weight:800; color:var(--ink-2); margin-bottom:8px; letter-spacing:.01em; }
  .dd-item{
    display:flex; align-items:center; gap:8px;
    padding:8px 0; font-size:13.5px; color:var(--ink); cursor:pointer;
  }
  .dd-item .rank{ flex:none; font-size:11px; font-weight:800; color:var(--orange); width:14px; }
  .dd-item span.txt{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .dd-item:active{ opacity:.6; }
  .dd-tags{ display:flex; flex-wrap:wrap; gap:6px; }
  .dd-tag{
    font-size:12.5px; font-weight:600; color:#A85A20; background:var(--orange-050);
    padding:6px 12px; border-radius:999px; cursor:pointer;
  }
  .dd-empty{ font-size:12.5px; color:var(--ink-3); padding:4px 0 8px; }
  .dd-divider{ height:1px; background:var(--border-soft); margin:2px 18px; }

  /* ---------- category pills ---------- */
  .cat-toolbar{
    display:flex; justify-content:flex-end; gap:6px;
    padding:0 20px; margin:12px 0 6px;
  }
  .cat-scroll{
    display:flex; gap:7px;
    padding:0 20px; margin:0 0 4px;
    overflow-x:auto; scrollbar-width:none;
  }
  .cat-scroll::-webkit-scrollbar{ display:none; }
  .cat-manage-btn{
    flex:none; width:26px; height:26px; border-radius:50%;
    border:1px solid var(--border); background:var(--white); color:var(--ink-2);
    font-size:11.5px; cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .cat-manage-btn:active{ background:var(--gray-bg); }
  .cat-pill{
    position:relative;
    flex:none; padding:7px 14px; border-radius:999px;
    font-size:12.5px; font-weight:600; white-space:nowrap; cursor:pointer;
    border:1px solid var(--border); color:var(--ink-2); background:var(--white);
  }
  .cat-pill.active{ background:var(--orange); border-color:var(--orange); color:#fff; font-weight:700; }
  .cat-del{
    flex:none; width:20px; height:20px; border-radius:50%;
    background:var(--badge-bg); color:var(--ink-2); font-size:10px; line-height:20px; text-align:center;
    cursor:pointer;
  }
  .cat-del:active{ background:#E7A98E; color:#fff; }

  /* ---------- list ---------- */
  .cat-desc-banner{
    display:none; margin:14px 20px 0; padding:11px 14px;
    background:var(--orange-050); border-radius:12px;
    font-size:12.5px; color:#A85A20; line-height:1.5;
  }
  .cat-desc-banner.show{ display:block; }
  .result-info{
    padding:18px 20px 4px; font-size:12px; color:var(--ink-3); font-weight:600;
  }
  .list{ padding:2px 20px 100px; }
  .empty{ text-align:center; padding:70px 20px; color:var(--ink-2); }
  .empty .emoji{ font-size:30px; margin-bottom:10px; opacity:.6; }
  .empty b{ display:block; color:var(--ink); font-size:14.5px; margin-bottom:4px; }
  .empty small{ font-size:12.5px; color:var(--ink-3); }

  .row{
    display:flex; align-items:center; gap:12px;
    padding:15px 0;
    border-bottom:1px solid var(--border-soft);
    cursor:pointer;
  }
  .row:active{ opacity:.55; }
  .row-thumb{
    flex:none; width:42px; height:42px; border-radius:10px; object-fit:cover;
    border:1px solid var(--border-soft);
  }
  .row-body{ flex:1; min-width:0; }
  .row-top{ display:flex; align-items:center; gap:6px; margin-bottom:4px; flex-wrap:wrap; }
  .row-cat{ font-size:11px; font-weight:700; color:var(--orange); }
  .badge{
    font-size:9.5px; font-weight:800; padding:2px 6px; border-radius:5px;
  }
  .badge.new{ background:var(--orange-100); color:var(--orange); }
  .badge.ended{ background:var(--badge-bg); color:var(--ink-3); }
  .row-title{
    font-size:14.5px; font-weight:600; color:var(--ink); line-height:1.4;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .row-meta{ font-size:11.5px; color:var(--ink-3); margin-top:3px; font-weight:500; }
  .row-chev{ flex:none; color:var(--ink-3); }

  /* ---------- fab ---------- */
  .fab{
    position:fixed; right:0; bottom:0;
    left:0; display:flex; justify-content:center;
    pointer-events:none;
    padding-bottom:22px;
  }
  @media (min-width:680px){ .fab{ } }
  .fab-inner{
    max-width:480px; width:100%; display:flex; justify-content:flex-end; padding:0 20px;
  }
  @media (min-width:680px){ .fab-inner{ max-width:600px; } }
  .fab-btn{
    pointer-events:auto;
    width:58px; height:58px; border-radius:50%;
    background:var(--orange); color:#fff; border:none;
    cursor:pointer; padding:0;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 4px 14px rgba(255,122,47,0.35);
  }
  .fab-btn svg{ display:block; }
  .fab-btn:active{ background:#E86A21; }

  /* ---------- detail page ---------- */
  .detail{
    position:fixed; inset:0; background:var(--white); z-index:60;
    display:none; flex-direction:column;
    max-width:480px; margin:0 auto;
  }
  @media (min-width:680px){ .detail{ max-width:600px; } }
  .detail.show{ display:flex; }
  .detail-top{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 14px; border-bottom:1px solid var(--border-soft); flex:none;
  }
  .back-btn{
    width:34px; height:34px; border-radius:50%; border:none; background:transparent;
    display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--ink);
  }
  .back-btn:active{ background:var(--gray-bg); }
  .detail-actions{ display:flex; gap:2px; }
  .icon-btn-sm{
    width:34px; height:34px; border-radius:50%; border:none; background:transparent;
    display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--ink-2); font-size:15px;
  }
  .icon-btn-sm:active{ background:var(--gray-bg); }

  .detail-scroll{ flex:1; overflow-y:auto; padding:24px 22px 30px; }
  .detail-cat-row{ display:flex; align-items:center; gap:8px; margin-bottom:10px; }
  .detail-cat{ font-size:12px; font-weight:700; color:var(--orange); }
  .detail-q{ font-size:19px; font-weight:800; line-height:1.45; color:var(--ink); margin-bottom:10px; }
  .detail-meta{ font-size:12px; color:var(--ink-3); font-weight:500; margin-bottom:22px; }
  .detail-a{
    font-size:14.5px; line-height:1.75; color:#3C3C3C; white-space:pre-wrap;
    margin-bottom:26px;
  }
  .sec-label{ font-size:11.5px; font-weight:800; color:var(--ink-2); margin-bottom:10px; }
  .img-grid{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:26px; }
  .img-grid img{
    width:96px; height:96px; object-fit:cover; border-radius:12px; border:1px solid var(--border-soft); cursor:zoom-in;
  }
  .file-list{ margin-bottom:10px; }
  .file-item{
    display:flex; align-items:center; gap:10px; padding:11px 0;
    border-bottom:1px solid var(--border-soft); font-size:13.5px; color:var(--ink);
  }
  .file-item .fic{ color:var(--ink-3); flex:none; }
  .file-item span{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .file-item a{ color:var(--orange); font-size:12px; font-weight:700; text-decoration:none; flex:none; }

  .detail-bottom{
    flex:none; padding:14px 20px calc(14px + env(safe-area-inset-bottom));
    border-top:1px solid var(--border-soft);
  }
  .copy-btn-lg{
    width:100%; background:var(--orange); color:#fff; border:none;
    padding:15px; border-radius:14px; font-size:15px; font-weight:700; cursor:pointer;
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .copy-btn-lg:active{ background:#E86A21; }
  .copy-hint{ text-align:center; font-size:11.5px; color:var(--ink-3); margin-top:8px; }

  /* ---------- modal (write / edit) ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(20,18,16,0.4);
    display:none; align-items:flex-end; justify-content:center; z-index:100;
  }
  .overlay.show{ display:flex; }
  @media (min-width:680px){ .overlay{ align-items:center; } }
  .modal{
    background:#fff; width:100%; max-width:480px;
    border-radius:22px 22px 0 0;
    max-height:88vh; overflow-y:auto;
    padding:22px 20px 26px;
    animation:slideup .2s ease;
  }
  @media (min-width:680px){ .modal{ border-radius:22px; max-height:85vh; max-width:520px; } }
  @keyframes slideup{ from{ transform:translateY(24px); opacity:0;} to{ transform:translateY(0); opacity:1;} }
  .modal-title{ font-size:16.5px; font-weight:800; margin-bottom:18px; display:flex; align-items:center; justify-content:space-between; }
  .modal-title button{ border:none; background:var(--gray-bg); width:28px; height:28px; border-radius:50%; font-size:13px; color:var(--ink-2); cursor:pointer; }

  .field{ margin-bottom:16px; }
  .field label{ font-size:12px; font-weight:700; color:var(--ink-2); display:block; margin-bottom:7px; }
  .field input[type=text], .field textarea{
    width:100%; border:1px solid var(--border); border-radius:12px;
    padding:12px 13px; font-size:14px; color:var(--ink);
    outline:none; background:var(--white);
  }
  .field input[type=text]:focus, .field textarea:focus{ border-color:var(--orange); }
  .field textarea{ min-height:110px; resize:vertical; line-height:1.5; }

  .pill-select{ display:flex; flex-wrap:wrap; gap:7px; }
  .pill-select div{
    padding:8px 13px; border-radius:999px; font-size:12.5px; font-weight:600;
    border:1px solid var(--border); color:var(--ink-2); cursor:pointer;
  }
  .pill-select div.sel{ background:var(--orange); border-color:var(--orange); color:#fff; font-weight:700; }

  .status-toggle{ display:flex; gap:8px; }
  .status-toggle div{
    flex:1; text-align:center; padding:10px; border-radius:12px; font-size:13px; font-weight:600;
    border:1px solid var(--border); color:var(--ink-2); cursor:pointer;
  }
  .status-toggle div.sel{ background:var(--orange-050); border-color:var(--orange); color:var(--orange); font-weight:700; }

  .file-add-row{ display:flex; flex-wrap:wrap; gap:8px; }
  .file-thumb{ position:relative; width:60px; height:60px; border-radius:10px; overflow:hidden; border:1px solid var(--border); background:var(--gray-bg); display:flex; align-items:center; justify-content:center; }
  .file-thumb img{ width:100%; height:100%; object-fit:cover; }
  .file-thumb .fname{ font-size:8.5px; text-align:center; padding:2px; color:var(--ink-2); word-break:break-all; }
  .file-thumb button{
    position:absolute; top:2px; right:2px; width:16px; height:16px; border-radius:50%;
    background:rgba(0,0,0,.55); color:#fff; border:none; font-size:9px; cursor:pointer; line-height:1;
  }
  .file-add-btn{
    width:60px; height:60px; border-radius:10px; border:1px dashed var(--border);
    display:flex; align-items:center; justify-content:center; color:var(--ink-3);
    font-size:20px; cursor:pointer; background:var(--gray-bg);
  }
  .hint{ font-size:11px; color:var(--ink-3); margin-top:7px; line-height:1.5; }

  .cat-manage-row{
    display:flex; align-items:center; gap:8px;
    padding:5px 0; line-height:1.2;
  }
  .cat-manage-row .cmr-name{
    flex:none; max-width:64px; font-size:12.5px; font-weight:700; color:var(--ink);
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; line-height:1.2;
  }
  .cmr-desc{
    flex:0 1 auto; min-width:0; max-width:110px; font-size:11px; color:var(--ink-3);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; line-height:1.2;
  }
  .cmr-desc.is-empty{ font-style:italic; opacity:.55; }
  .cat-manage-row .cmr-count{ flex:none; font-size:10.5px; color:var(--ink-3); margin-left:auto; }
  .cmr-icon-btn{
    flex:none; width:19px; height:19px; border-radius:50%; border:none;
    background:var(--gray-bg); color:var(--ink-2); font-size:10px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; padding:0;
  }
  .cmr-icon-btn:active{ background:var(--orange-100); color:var(--orange); }

  .cat-edit-row{
    padding:10px 0; border-bottom:1px solid var(--border-soft);
    background:var(--orange-050); border-radius:10px;
    padding:10px 10px; margin:2px 0;
  }
  .cat-edit-input{
    width:100%; border:1px solid var(--border); border-radius:10px;
    padding:9px 10px; font-size:13px; outline:none; background:var(--white);
    margin-bottom:7px;
  }
  .cat-edit-input:focus{ border-color:var(--orange); }
  .cat-edit-actions{ display:flex; gap:7px; justify-content:flex-end; }
  .cat-edit-actions button{
    border:none; border-radius:10px; padding:7px 14px; font-size:12px; font-weight:700; cursor:pointer;
  }
  .cat-edit-cancel{ background:var(--gray-bg); color:var(--ink-2); }
  .cat-edit-save{ background:var(--orange); color:#fff; }
  .cat-edit-save:active{ background:#E86A21; }

  .submit-btn{
    width:100%; background:var(--orange); color:#fff; border:none;
    padding:15px; border-radius:14px; font-size:15px; font-weight:700; cursor:pointer;
    margin-top:6px;
  }
  .submit-btn:active{ background:#E86A21; }
  .delete-link{
    display:block; text-align:center; margin-top:14px; font-size:12.5px; color:var(--ink-3);
    cursor:pointer; font-weight:600;
  }

  /* lightbox */
  .lightbox{
    position:fixed; inset:0; background:rgba(0,0,0,.88); z-index:200;
    display:none; align-items:center; justify-content:center; padding:20px;
  }
  .lightbox.show{ display:flex; }
  .lightbox img{ max-width:100%; max-height:90vh; border-radius:8px; }

  /* toast */
  .toast{
    position:fixed; left:50%; bottom:30px; transform:translateX(-50%) translateY(20px);
    background:var(--ink); color:#fff; padding:11px 20px; border-radius:999px;
    font-size:13px; font-weight:600; z-index:300; opacity:0; transition:all .25s;
    pointer-events:none; white-space:nowrap;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  .loading-row{ text-align:center; padding:50px 0; color:var(--ink-3); font-size:13px; }

  /* ---------- requested compact layout adjustments ---------- */
  #catOverlay .modal{
    padding:18px 20px 20px;
  }
  #catOverlay .modal-title{
    margin-bottom:12px;
  }
  #catOverlay .field{
    margin-bottom:11px;
  }
  #catOverlay .field label{
    margin-bottom:5px;
  }
  #catOverlay .hint{
    margin-top:4px;
  }
  #catOverlay #newCatDesc{
    margin-top:6px !important;
  }
  #catOverlay #newCatAddBtn{
    margin-top:6px !important;
    padding:13px;
  }
  .cat-manage-row{
    gap:6px;
    padding:3px 0;
  }
  .cat-manage-row .cmr-count{
    margin-left:auto;
    color:#9A9A9A;
  }
  .cmr-desc{
    flex:0 1 auto;
    max-width:150px;
    color:#666666;
    font-size:11px;
  }
  .cmr-desc.is-empty{
    color:#9A9A9A;
  }
  .fab{
    padding-bottom:54px;
  }


  /* ---------- refined compact category management ---------- */
  #catOverlay .modal{
    padding:16px 18px 18px;
    max-height:82vh;
  }
  #catOverlay .modal-title{ margin-bottom:10px; }
  #catOverlay .field{ margin-bottom:10px; }
  #catOverlay .field label{ margin-bottom:5px; }
  #catOverlay .new-cat-field{
    padding:10px;
    border:1px solid var(--border-soft);
    border-radius:12px;
    background:var(--gray-bg);
  }
  #catOverlay .new-cat-row{
    display:grid;
    grid-template-columns:1fr auto;
    gap:7px;
    align-items:center;
  }
  #catOverlay .new-cat-field input{
    width:100%;
    border:1px solid var(--border);
    border-radius:10px;
    padding:9px 10px;
    font-size:13px;
    background:#fff;
    outline:none;
  }
  #catOverlay .new-cat-field input:focus{ border-color:var(--orange); }
  #catOverlay #newCatDesc{ margin-top:7px !important; }
  #catOverlay #newCatAddBtn{
    width:auto;
    min-width:58px;
    margin:0 !important;
    padding:10px 13px;
    border-radius:10px;
    font-size:13px;
  }
  #catOverlay .category-list-field{ margin-bottom:6px; }
  #catOverlay #catManageList{
    max-height:38vh;
    overflow-y:auto;
    padding-right:2px;
  }
  .cat-manage-row{
    gap:6px;
    padding:6px 0;
    min-height:31px;
    border-bottom:1px solid var(--border-soft);
  }
  .cat-manage-row:last-child{ border-bottom:none; }
  .cat-manage-row .cmr-name{ max-width:86px; }
  .cat-manage-row .cmr-count{
    order:3;
    margin-left:auto;
    color:#9A9A9A;
  }
  .cmr-desc{
    order:2;
    flex:1 1 auto;
    max-width:none;
    color:#666666;
    font-size:11px;
  }
  .cmr-icon-btn{ order:4; }
  .cat-manage-row .cat-del{ order:5; }
  #catOverlay .hint{ margin-top:5px; }

  /* ---------- clearer write action ---------- */
  .fab{ padding-bottom:calc(24px + env(safe-area-inset-bottom)); }
  .fab-btn{
    width:auto;
    min-width:108px;
    height:50px;
    border-radius:999px;
    padding:0 18px;
    gap:7px;
    font-size:14px;
    font-weight:800;
  }

    min-height:42px; padding:8px 2px;
    border:none; border-bottom:1px solid var(--border-soft);
    background:transparent; cursor:pointer; user-select:none;
  }
  .notice-check input{
    order:2; width:18px; height:18px; margin:0; flex:none;
    accent-color:var(--orange); cursor:pointer;
  }
  .notice-check-text{
    order:1; flex:1; min-width:0;
    display:flex; align-items:baseline; gap:7px;
  }
  .notice-check-title{
    flex:none; font-size:12.5px; font-weight:700; color:var(--ink);
  }
  .notice-check-desc{
    margin:0; min-width:0; overflow:hidden; text-overflow:ellipsis;
    white-space:nowrap; font-size:10.5px; line-height:1.3; color:var(--ink-3);
  }

  .row{
    min-height:46px;
    padding:11px 2px;
    gap:9px;
  }
  .row .row-body{
    display:flex;
    align-items:center;
    gap:8px;
    min-width:0;
  }
  .row .row-top{
    flex:none;
    margin:0;
  }
  .row .row-meta{
    display:none;
  }
  .row .row-title{
    flex:1;
    min-width:0;
    font-size:13.5px;
    font-weight:650;
    line-height:1.35;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .row .row-thumb{
    display:none;
    width:34px;
    height:34px;
    border-radius:8px;
    object-fit:cover;
    flex:none;
  }
  .row.notice-row{
    margin:0;
    border:none;
    border-bottom:1px solid var(--border-soft);
    border-radius:0;
    background:transparent;
  }
  .row.notice-row + .row:not(.notice-row){ margin-top:8px; }
  .row.notice-row .row-cat,
  .row.notice-row .row-thumb{
    display:none;
  }
  .row.notice-row .badge.new,
  .row.notice-row .badge.ended{
    display:none;
  }
  .badge.notice{
    flex:none;
    background:var(--orange-050);
    color:var(--orange);
    border:1px solid #F4D5C0;
    font-size:9.5px;
    padding:3px 7px;
    border-radius:6px;
  }
  .detail.notice-detail .detail-scroll{ background:linear-gradient(180deg, var(--orange-050) 0, #fff 150px); }

  .fab{ transition:opacity .18s ease, transform .18s ease, visibility .18s ease; }
  @media (max-width:679px){
    body.detail-open .fab{
      opacity:0; visibility:hidden; pointer-events:none; transform:translateY(12px);
    }
  }


.row-title .badge{
  margin-left:6px;
  vertical-align:middle;
}

</style>
</head>

  // ---------- Supabase 연결 ----------
  const SUPABASE_URL = "https://cfimgijtocyyxofbmfdr.supabase.co";
  // 아래 문자열을 Supabase의 전체 Publishable key로 교체하세요.
  const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_WVUPAR2hxthIxgx9uUfOdg_iC09lizM";
  const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

  // 검색 기록과 카테고리 UI 설정만 이 브라우저에 저장합니다.
  // 질문·답변·공지·복사 횟수·휴지통은 Supabase qna 테이블에 저장됩니다.
  const storageApi = {
    async get(key){
      const value = localStorage.getItem(key);
      return value === null ? null : { value };
    },
    async set(key, value){
      localStorage.setItem(key, value);
      return { value };
    }
  };

  function dbRowToEntry(row){
    let packed = {};
    try{ packed = row.image_url ? JSON.parse(row.image_url) : {}; }catch(e){ packed = {}; }
    const files = Array.isArray(packed.files) ? packed.files : [];
    return {
      id: String(row.id),
      category: row.category || "기타",
      question: row.title || "",
      answer: row.answer || "",
      isNotice: Boolean(row.is_notice),
      copyCount: Number(row.copy_count || 0),
      createdAt: row.created_at ? new Date(row.created_at).getTime() : Date.now(),
      updatedAt: row.updated_at ? new Date(row.updated_at).getTime() : Date.now(),
      deletedAt: row.deleted_at ? new Date(row.deleted_at).getTime() : null,
      files,
      status: packed.status || "active",
      author: packed.author || "본사",
      viewCount: Number(packed.viewCount || 0)
    };
  }

  function entryToDbRow(entry, deleted=false){
    return {
      category: entry.category || "기타",
      title: entry.question || "",
      answer: entry.answer || "",
      is_notice: Boolean(entry.isNotice),
      copy_count: Number(entry.copyCount || 0),
      image_url: JSON.stringify({
        files: Array.isArray(entry.files) ? entry.files : [],
        status: entry.status || "active",
        author: entry.author || "본사",
        viewCount: Number(entry.viewCount || 0)
      }),
      updated_at: new Date().toISOString(),
      deleted: Boolean(deleted),
      deleted_at: deleted ? new Date(entry.deletedAt || Date.now()).toISOString() : null
    };
  }

  async function insertNewEntry(entry, deleted=false){
    const payload = entryToDbRow(entry, deleted);
    payload.created_at = new Date(entry.createdAt || Date.now()).toISOString();
    const { data, error } = await supabaseClient.from("qna").insert(payload).select().single();
    if(error) throw error;
    entry.id = String(data.id);
    return entry;
  }

  async function upsertExistingEntry(entry, deleted=false){
    const numericId = Number(entry.id);
    if(!Number.isInteger(numericId)) return insertNewEntry(entry, deleted);
    const payload = { id:numericId, ...entryToDbRow(entry, deleted) };
    payload.created_at = new Date(entry.createdAt || Date.now()).toISOString();
    const { error } = await supabaseClient.from("qna").upsert(payload, { onConflict:"id" });
    if(error) throw error;
    return entry;
  }

  async function loadEntries(){
    if(SUPABASE_PUBLISHABLE_KEY.includes("PASTE_FULL")){
      entries = [];
      trashEntries = [];
      showToast("Publishable key를 먼저 입력해주세요");
    } else {
      try{
        const cutoff = new Date(Date.now() - TRASH_TTL).toISOString();
        await supabaseClient.from("qna").delete().eq("deleted", true).lt("deleted_at", cutoff);

        const { data, error } = await supabaseClient
          .from("qna")
          .select("*")
          .order("created_at", { ascending:false });
        if(error) throw error;

        const all = (data || []).map(dbRowToEntry);
        entries = all.filter(item=>!item.deletedAt);
        trashEntries = all.filter(item=>Boolean(item.deletedAt));

        // 새 테이블이 비어 있으면 기존 예시 질문을 한 번만 등록합니다.
        if(all.length === 0){
          entries = seedData();
          await saveEntries();
        }
      }catch(e){
        console.error("Supabase load failed", e);
        entries = [];
        trashEntries = [];
        showToast("Supabase 연결을 확인해주세요");
      }
    }

    try{
      const cs = await storageApi.get(CATS_KEY);
      CATS = (cs && cs.value) ? JSON.parse(cs.value) : null;
      if(!CATS || !CATS.length){ CATS = DEFAULT_CATS.slice(); await saveCategories(); }
    }catch(e){ CATS = DEFAULT_CATS.slice(); }
    try{
      const ds = await storageApi.get(CAT_DESC_KEY);
      CAT_DESC = (ds && ds.value) ? JSON.parse(ds.value) : {};
    }catch(e){ CAT_DESC = {}; }
    try{
      const rs = await storageApi.get(RECENT_KEY);
      recentSearches = (rs && rs.value) ? JSON.parse(rs.value) : [];
    }catch(e){ recentSearches = []; }

    updateTrashCount();
    render();
    renderQuickPopular();
  }

  async function saveEntries(){
    try{
      for(const entry of entries) await upsertExistingEntry(entry, false);
      return true;
    }catch(e){
      console.error("entries save failed", e);
      showToast("저장에 실패했어요");
      return false;
    }
  }

  async function saveTrash(){
    try{
      for(const entry of trashEntries) await upsertExistingEntry(entry, true);
      return true;
    }catch(e){
      console.error("trash save failed", e);
      showToast("휴지통 저장에 실패했어요");
      return false;
    }
  }

  function purgeExpiredTrash(){
    const now = Date.now();
    const expired = trashEntries.filter(item=> now - Number(item.deletedAt || 0) >= TRASH_TTL);
    trashEntries = trashEntries.filter(item=> now - Number(item.deletedAt || 0) < TRASH_TTL);
    if(expired.length && !SUPABASE_PUBLISHABLE_KEY.includes("PASTE_FULL")){
      const ids = expired.map(x=>Number(x.id)).filter(Number.isInteger);
      if(ids.length) supabaseClient.from("qna").delete().in("id", ids).then(({error})=>{ if(error) console.error(error); });
    }
    return expired.length > 0;
  }

  function updateTrashCount(){
    const countEl = $("trashCount");
    if(countEl) countEl.textContent = String(trashEntries.length);
  }

  async function saveCategories(){
    try{ await storageApi.set(CATS_KEY, JSON.stringify(CATS)); return true; }
    catch(e){ console.error("categories save failed", e); return false; }
  }
  async function saveCatDesc(){
    try{ await storageApi.set(CAT_DESC_KEY, JSON.stringify(CAT_DESC)); return true; }
    catch(e){ console.error("category descriptions save failed", e); return false; }
  }

  // ---------- categories ----------
  function renderCatPills(){
    const cats = ["전체", ...CATS];
    catScroll.innerHTML = cats.map(c=>
      `<div class="cat-pill ${c===filterCat?'active':''}" data-cat="${escapeHtml(c)}">${escapeHtml(c)}</div>`
    ).join("");
    catScroll.querySelectorAll(".cat-pill").forEach(el=>{
      el.addEventListener("click", ()=>{
        filterCat = el.getAttribute("data-cat");
        renderCatPills();
        renderCatDescBanner();
        renderList();
      });
    });
    renderCatDescBanner();
    requestAnimationFrame(updateCatScrollButtons);
  }

  function updateCatScrollButtons(){
    const left = $("catScrollLeft");
    const right = $("catScrollRight");
    const overflowing = catScroll.scrollWidth > catScroll.clientWidth + 3;
    catScroll.classList.toggle("is-overflowing", overflowing);
    if(!left || !right) return;
    left.disabled = catScroll.scrollLeft <= 2;
    right.disabled = catScroll.scrollLeft + catScroll.clientWidth >= catScroll.scrollWidth - 2;
  }
  $("catScrollLeft").addEventListener("click", ()=> catScroll.scrollBy({left:-180, behavior:"smooth"}));

  function initCategoryDrag(box){
    let activeRow = null;
    let startIndex = -1;
    let pointerId = null;

    box.querySelectorAll(".cmr-drag-handle").forEach(handle=>{
      handle.addEventListener("pointerdown", (e)=>{
        if(e.button !== undefined && e.button !== 0) return;
        activeRow = handle.closest(".cat-manage-row");
        if(!activeRow) return;
        startIndex = Number(activeRow.dataset.catIndex);
        pointerId = e.pointerId;
        handle.setPointerCapture?.(pointerId);
        activeRow.classList.add("dragging");
        e.preventDefault();
      });

      handle.addEventListener("pointermove", (e)=>{
        if(!activeRow || e.pointerId !== pointerId) return;
        const rows = [...box.querySelectorAll(".cat-manage-row")].filter(r=>r !== activeRow);
        rows.forEach(r=>r.classList.remove("drag-over"));
        const target = rows.find(r=>{
          const rect = r.getBoundingClientRect();
          return e.clientY >= rect.top && e.clientY <= rect.bottom;
        });
        if(!target) return;
        const rect = target.getBoundingClientRect();
        const before = e.clientY < rect.top + rect.height/2;
        target.classList.add("drag-over");
        box.insertBefore(activeRow, before ? target : target.nextSibling);
      });

      const finish = async (e)=>{
        if(!activeRow || (e.pointerId !== undefined && e.pointerId !== pointerId)) return;
        box.querySelectorAll(".cat-manage-row").forEach(r=>r.classList.remove("drag-over","dragging"));
        const orderedNames = [...box.querySelectorAll(".cat-manage-row .cmr-name")].map(el=>el.textContent);
        const changed = orderedNames.some((name, i)=>name !== CATS[i]);
        activeRow = null;
        pointerId = null;
        if(changed){
          CATS = orderedNames;
          await saveCategories();
          renderCatPills();
          renderCatManageList();
          showToast("카테고리 순서를 변경했어요");
        }
      };
      handle.addEventListener("pointerup", finish);
      handle.addEventListener("pointercancel", finish);
    });
  }

  async function addCategory(){
    const name = $("newCatName").value.trim();
    const desc = $("newCatDesc").value.trim();
    if(!name){ showToast("제목을 입력해주세요"); return; }

    CATS.push(name);

  async function saveCatEdit(){
    const oldName = catEditingName;
    const newName = $("editCatName").value.trim();
    const newDesc = $("editCatDesc").value.trim();
    if(!newName){ showToast("제목을 입력해주세요"); return; }
    if(newName !== oldName && (newName === "전체" || CATS.includes(newName))){ showToast("이미 있는 카테고리예요"); return; }

    const idx = CATS.indexOf(oldName);
    if(idx === -1) return;
    CATS[idx] = newName;
    if(newName !== oldName){
      entries.forEach(e=>{ if(e.category === oldName) e.category = newName; });
      if(filterCat === oldName) filterCat = newName;
    }
    delete CAT_DESC[oldName];
    if(newDesc){ CAT_DESC[newName] = newDesc; } else { delete CAT_DESC[newName]; }

    await saveCategories();
    await saveCatDesc();
    if(newName !== oldName) await saveEntries();

    catEditingName = null;
    showToast("카테고리를 저장했어요 ✓");
    renderCatPills();
    renderCatManageList();
    renderCatDescBanner();
    renderList();
  }

  async function deleteCategory(name){
    if(CATS.length <= 1){ showToast("카테고리를 하나는 남겨둬야 해요"); return; }
    const count = entries.filter(e=> e.category === name).length;
    const msg = count > 0
      ? `'${name}' 카테고리를 삭제할까요?\n이 카테고리를 쓰는 질문 ${count}개는 '기타'로 이동해요.`
      : `'${name}' 카테고리를 삭제할까요?`;
    if(!confirm(msg)) return;

    CATS = CATS.filter(c=> c !== name);
    if(count > 0){
      const fallback = CATS.includes("기타") ? "기타" : CATS[0];
      entries.forEach(e=>{ if(e.category === name) e.category = fallback; });
      await saveEntries();
    }
    if(CAT_DESC[name] !== undefined){ delete CAT_DESC[name]; await saveCatDesc(); }
    await saveCategories();
    if(filterCat === name) filterCat = "전체";
    showToast(`'${name}' 카테고리를 삭제했어요`);
    renderCatPills();
    renderCatManageList();
    renderList();
  }

  async function restoreTrashItem(id, fromUndo=false){
    const idx = trashEntries.findIndex(x=>x.id===id);
    if(idx < 0) return;
    const item = trashEntries[idx];
    trashEntries.splice(idx,1);
    const restored = {...item};
    delete restored.deletedAt;
    entries.push(restored);
    await Promise.all([saveEntries(), saveTrash()]);
    updateTrashCount();
    render();

    if(fromUndo) hideUndoToast();

  async function permanentlyDeleteTrashItem(id, button=null){
    const item = trashEntries.find(x=>x.id===id);
    if(!item) return;
    if(!confirm(`“${item.question || "제목 없음"}”을 영구 삭제할까요?\n\n영구 삭제한 질문은 다시 복원할 수 없어요.`)) return;

    if(button) button.disabled = true;
    try{
      const numericId = Number(item.id);
      if(!Number.isInteger(numericId)) throw new Error("잘못된 게시글 ID입니다.");
      const { error } = await supabaseClient.from("qna").delete().eq("id", numericId);
      if(error) throw error;

      trashEntries = trashEntries.filter(x=>x.id!==id);
      if(lastDeletedId===id){
        lastDeletedId = null;
        hideUndoToast();
      }
      updateTrashCount();
      renderTrashList();
      showToast("영구 삭제했어요");
    }catch(e){
      console.error("permanent delete failed", e);
      showToast("영구 삭제에 실패했어요");
      if(button) button.disabled = false;
    }
  }

      <div class="dd-section">
        <div class="dd-title">🔥 많이 찾는 질문</div>
        ${topHtml}
      </div>
      <div class="dd-divider"></div>
      <div class="dd-section">
        <div class="dd-title">🕒 최근 검색</div>
        ${recentHtml}
      </div>
      <div class="dd-divider"></div>
      <div class="dd-section">
        <div class="dd-title">🏷 인기 태그</div>
        ${tagsHtml}
      </div>
    `;
    dropdown.querySelectorAll("[data-fill]").forEach(el=>{
      el.addEventListener("click", ()=>{
        const v = el.getAttribute("data-fill");
        searchInput.value = v;
        runSearch(v);
        closeDropdown();
        searchInput.blur();
      });
    });
  }

  function openDropdown(){ renderDropdown(); dropdown.classList.add("show"); }
  function closeDropdown(){ dropdown.classList.remove("show"); }

  function runSearch(v){
    searchQuery = v.trim();
    $("searchClear").style.display = searchQuery ? "flex" : "none";
    renderList();
    if(searchQuery){
      recentSearches = [searchQuery, ...recentSearches.filter(x=>x!==searchQuery)].slice(0,5);
      saveRecent();
    }
  }

  searchInput.addEventListener("focus", ()=>{
    openDropdown();
  });
  searchInput.addEventListener("input", (e)=>{
    searchQuery = e.target.value.trim();
    $("searchClear").style.display = searchQuery ? "flex" : "none";
    renderList();
    renderDropdown();
  });
  searchInput.addEventListener("keydown",(e)=>{
    if(e.key === "Enter"){
      runSearch(searchInput.value);
      closeDropdown();
      searchInput.blur();
    }
  });
  searchInput.addEventListener("blur", ()=>{
    setTimeout(()=>{
      closeDropdown();
      if(searchInput.value.trim()) runSearch(searchInput.value);
    }, 150);
  });
  $("searchClear").addEventListener("mousedown",(e)=>{ e.preventDefault(); });
  $("searchClear").addEventListener("click", ()=>{
    searchInput.value = "";
    searchQuery = "";
    $("searchClear").style.display = "none";
    renderList();
    renderDropdown();
  });
  document.addEventListener("click",(e)=>{
    if(!e.target.closest(".search-wrap")) closeDropdown();
  });

  // ---------- modal (write/edit) ----------
  const overlay = $("overlay");
  let selectedCat = CATS[0];

  function renderCatPillSelect(){
    $("catPillSelect").innerHTML = CATS.map(c=>`<div data-c="${escapeHtml(c)}" class="${c===selectedCat?'sel':''}">${escapeHtml(c)}</div>`).join("");
    $("catPillSelect").querySelectorAll("div").forEach(d=>{
      d.addEventListener("click", ()=>{
        selectedCat = d.getAttribute("data-c");
        renderCatPillSelect();
      });
    });
  }

  function openAddModal(){
    editingId = null;
    currentFiles = [];
    selectedCat = CATS[0];
    $("modalTitleText").textContent = "새 질문 등록";
    renderCatPillSelect();
    $("qInput").value = "";
    $("aInput").value = "";
    $("authorInput").value = "";
    $("noticeInput").checked = false;
    setStatusToggle("active");
    renderFileUpload();
    overlay.classList.add("show");
  }
  function openEditModal(id){
    const e = entries.find(x=>x.id===id);
    if(!e) return;
    editingId = id;
    currentFiles = (e.files||[]).slice();
    selectedCat = CATS.includes(e.category) ? e.category : CATS[0];
    $("modalTitleText").textContent = "질문 수정";
    renderCatPillSelect();
    $("qInput").value = e.question;
    $("aInput").value = e.answer;
    $("authorInput").value = e.author||"";
    $("noticeInput").checked = Boolean(e.isNotice);
    setStatusToggle(e.status);
    renderFileUpload();
    closeDetail();
    overlay.classList.add("show");
  }
  function setStatusToggle(v){
    document.querySelectorAll("#statusToggle div").forEach(d=> d.classList.toggle("sel", d.getAttribute("data-v")===v));
  }
  document.querySelectorAll("#statusToggle div").forEach(d=>{
    d.addEventListener("click", ()=> setStatusToggle(d.getAttribute("data-v")));
  });
  function closeModal(){ overlay.classList.remove("show"); }
  $("modalClose").addEventListener("click", closeModal);
  overlay.addEventListener("click",(e)=>{ if(e.target===overlay) closeModal(); });
  const fabMenu = $("fabMenu");
  const fabBackdrop = $("fabBackdrop");
  function setFabOpen(open){
    fabMenu.classList.toggle("open", open);
    fabBackdrop.classList.toggle("show", open);
    fabBackdrop.setAttribute("aria-hidden", String(!open));
    $("fabBtn").setAttribute("aria-expanded", String(open));
    $("fabBtn").setAttribute("aria-label", open ? "빠른 작업 닫기" : "빠른 작업 열기");
    const actions = fabMenu.querySelector(".fab-speed-actions");
    if(actions) actions.setAttribute("aria-hidden", String(!open));
  }
  $("fabBtn").addEventListener("click", ()=> setFabOpen(!fabMenu.classList.contains("open")));
  fabBackdrop.addEventListener("click", ()=> setFabOpen(false));
  $("fabWriteBtn").addEventListener("click", ()=>{ setFabOpen(false); openAddModal(); });


  document.addEventListener("keydown", (e)=>{
    if(e.key === "Escape" && $("fabMenu")?.classList.contains("open")) setFabOpen(false);
  });

  function renderFileUpload(){
    const box = $("fileUpload");
    box.innerHTML = currentFiles.map((f,idx)=>{
      const isImg = (f.type||"").startsWith("image/");
      return `<div class="file-thumb">
        ${isImg ? `<img src="${f.dataUrl}">` : `<div class="fname">${escapeHtml(f.name.slice(0,10))}</div>`}
        <button data-idx="${idx}" class="rm-file-btn">✕</button>
      </div>`;
    }).join("") + `<div class="file-add-btn" id="fileAddBtn">＋</div>`;
    box.querySelector("#fileAddBtn").addEventListener("click", ()=> $("fileInput").click());
    box.querySelectorAll(".rm-file-btn").forEach(b=>{
      b.addEventListener("click", ()=>{ currentFiles.splice(parseInt(b.getAttribute("data-idx")),1); renderFileUpload(); });
    });
  }

  $("fileInput").addEventListener("change", async (ev)=>{
    const files = Array.from(ev.target.files||[]);
    for(const f of files){
      try{
        if(f.type.startsWith("image/")){
          const dataUrl = await resizeImage(f, 900, 0.75);
          currentFiles.push({name:f.name, type:"image/jpeg", dataUrl});
        } else {
          const dataUrl = await readAsDataUrl(f);
          currentFiles.push({name:f.name, type:f.type||"application/octet-stream", dataUrl});
        }
      }catch(err){}
    }
    ev.target.value = "";
    renderFileUpload();
  });

  function readAsDataUrl(file){
    return new Promise((resolve,reject)=>{
      const r = new FileReader();
      r.onload = ()=> resolve(r.result);
      r.onerror = reject;
      r.readAsDataURL(file);
    });
  }
  function resizeImage(file, maxW, quality){
    return new Promise((resolve, reject)=>{
      const reader = new FileReader();
      reader.onload = (e)=>{
        const img = new Image();
        img.onload = ()=>{
          let w=img.width, h=img.height;
          if(w>maxW){ h=Math.round(h*maxW/w); w=maxW; }
          const canvas=document.createElement("canvas");
          canvas.width=w; canvas.height=h;
          canvas.getContext("2d").drawImage(img,0,0,w,h);
          resolve(canvas.toDataURL("image/jpeg", quality));
        };
        img.onerror=reject;
        img.src=e.target.result;
      };
      reader.onerror=reject;
      reader.readAsDataURL(file);
    });
  }

  $("submitBtn").addEventListener("click", async ()=>{
    const q = $("qInput").value.trim();
    const a = $("aInput").value.trim();
    const author = $("authorInput").value.trim();
    const isNotice = $("noticeInput").checked;
    const statusEl = document.querySelector("#statusToggle div.sel");
    const status = statusEl ? statusEl.getAttribute("data-v") : "active";
    if(!q){ showToast("질문을 입력해주세요"); return; }
    if(!a){ showToast("답변을 입력해주세요"); return; }

    if(editingId){
      const e = entries.find(x=>x.id===editingId);
      if(e){ e.category=selectedCat; e.question=q; e.answer=a; e.author=author; e.status=status; e.files=currentFiles; e.isNotice=isNotice; }
      showToast("수정되었어요 ✓");
    } else {
      entries.push({ id:uid(), category:selectedCat, question:q, answer:a, author, status, files:currentFiles, isNotice, createdAt:Date.now(), copyCount:0, viewCount:0 });
      showToast("등록되었어요 ✓");
    }
    await saveEntries();
    closeModal();
    renderCatPills();
    renderList();
  });

  function render(){ renderCatPills(); renderList(); renderQuickPopular(); }
  loadEntries();
})();
</script>
</body>
</html>
